<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and patterns -->
  <defs>
    <!-- Orange brick pattern -->
    <pattern id="bricks" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#E76F51" />
      <path d="M 0 0 L 40 0 M 0 10 L 40 10 M 20 0 L 20 10 M 0 10 L 0 20 M 40 10 L 40 20 M 10 10 L 10 20 M 30 10 L 30 20" stroke="#F4A261" stroke-width="1.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    
    <linearGradient id="pattyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F3E1E" />
      <stop offset="100%" stop-color="#4A2812" />
    </linearGradient>

    <linearGradient id="cheeseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
  </defs>

  <style>
    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes smokeRise1 {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0; }
    }
    @keyframes smokeRise2 {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
    }
    .animated-burger {
      animation: bob 3s ease-in-out infinite;
      transform-origin: center;
    }
    .eye {
      animation: blink 4s infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .lettuce {
      animation: sway 4s ease-in-out infinite;
      transform-origin: center;
    }
    .smoke-1 {
      animation: smokeRise1 4s ease-in-out infinite;
      transform-origin: 335px 100px;
    }
    .smoke-2 {
      animation: smokeRise2 4s ease-in-out infinite;
      animation-delay: 2s;
      transform-origin: 335px 95px;
    }
  </style>

  <!-- Background circle or soft glow -->
  <circle cx="256" cy="256" r="240" fill="#FFF3E0" stroke="#FFB07C" stroke-width="8" />

  <!-- THE HOUSE-BURGER -->
  <g class="animated-burger">
    <!-- House Base / Bottom Bun -->
    <path d="M 120 400 Q 120 440 256 440 Q 392 440 392 400 Z" fill="#F4A261" stroke="#E76F51" stroke-width="4" />
    
    <!-- Brick House Body (Middle structure) -->
    <rect x="136" y="240" width="240" height="150" fill="url(#bricks)" stroke="#264653" stroke-width="6" rx="10" />
    
    <!-- Door (Brown wood door) -->
    <rect x="226" y="310" width="60" height="80" fill="#8B5A2B" stroke="#264653" stroke-width="4" rx="4" />
    <!-- Door knob -->
    <circle cx="240" cy="350" r="4" fill="#FFD166" />
    <!-- Door window/sign -->
    <rect x="236" y="320" width="40" height="20" fill="#E9C46A" rx="2" />
    
    <!-- Windows (Warm glowing light inside) -->
    <rect x="160" y="270" width="40" height="40" fill="#FFD166" stroke="#264653" stroke-width="4" rx="5" />
    <line x1="180" y1="270" x2="180" y2="310" stroke="#264653" stroke-width="2" />
    <line x1="160" y1="290" x2="200" y2="290" stroke="#264653" stroke-width="2" />

    <rect x="312" y="270" width="40" height="40" fill="#FFD166" stroke="#264653" stroke-width="4" rx="5" />
    <line x1="332" y1="270" x2="332" y2="310" stroke="#264653" stroke-width="2" />
    <line x1="312" y1="290" x2="352" y2="290" stroke="#264653" stroke-width="2" />
    
    <!-- Welcome Sign / Mat -->
    <ellipse cx="256" cy="400" rx="35" ry="8" fill="#D81B60" />
    
    <!-- Burger Patty Layer -->
    <rect x="120" y="210" width="272" height="40" fill="url(#pattyGrad)" stroke="#264653" stroke-width="6" rx="15" />
    
    <!-- Melted Cheese Layer dripping over the house walls -->
    <path d="M 120 230 
             L 120 245 
             Q 140 265 160 245 
             Q 180 275 200 245 
             Q 220 250 240 245
             L 256 250
             Q 280 270 300 245 
             Q 320 260 340 245 
             Q 370 275 392 245 
             L 392 230 Z" fill="url(#cheeseGrad)" stroke="#264653" stroke-width="4" />
             
    <!-- Lettuce layer -->
    <path class="lettuce" d="M 110 205 
             C 130 190, 150 220, 170 205 
             C 190 190, 210 220, 230 205 
             C 250 190, 270 220, 290 205 
             C 310 190, 330 220, 350 205 
             C 370 190, 390 220, 402 205
             L 392 220
             L 120 220 Z" fill="#2A9D8F" stroke="#264653" stroke-width="4" />

    <!-- House Roof / Top Bun -->
    <path d="M 110 190 Q 256 90 402 190 Z" fill="url(#roofGrad)" stroke="#264653" stroke-width="6" />
    
    <!-- Chimney -->
    <rect x="320" y="110" width="30" height="50" fill="url(#bricks)" stroke="#264653" stroke-width="4" />
    <path d="M 315 110 L 355 110" stroke="#264653" stroke-width="4" stroke-linecap="round" />
    
    <!-- Smoke puffs -->
    <circle class="smoke-1" cx="335" cy="100" r="8" fill="#B0BEC5" />
    <circle class="smoke-2" cx="335" cy="95" r="10" fill="#B0BEC5" />
    
    <!-- Sesame Seeds on the Roof/Bun -->
    <ellipse cx="180" cy="150" rx="4" ry="8" transform="rotate(30 180 150)" fill="#FFE3A8" />
    <ellipse cx="220" cy="135" rx="4" ry="8" transform="rotate(-15 220 135)" fill="#FFE3A8" />
    <ellipse cx="260" cy="130" rx="4" ry="8" transform="rotate(10 260 130)" fill="#FFE3A8" />
    <ellipse cx="300" cy="140" rx="4" ry="8" transform="rotate(-40 300 140)" fill="#FFE3A8" />
    <ellipse cx="340" cy="160" rx="4" ry="8" transform="rotate(25 340 160)" fill="#FFE3A8" />
    
    <!-- Cute Eyes -->
    <g class="eye">
      <circle cx="210" cy="160" r="12" fill="#264653" />
      <circle cx="206" cy="156" r="4" fill="#FFFFFF" />
    </g>
    <g class="eye">
      <circle cx="302" cy="160" r="12" fill="#264653" />
      <circle cx="298" cy="156" r="4" fill="#FFFFFF" />
    </g>
    <!-- Cheeks -->
    <circle cx="194" cy="170" r="6" fill="#E76F51" opacity="0.6" />
    <circle cx="318" cy="170" r="6" fill="#E76F51" opacity="0.6" />
    <!-- Smile -->
    <path d="M 244 170 Q 256 182 268 170" fill="none" stroke="#264653" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>